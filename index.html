<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Kards 单位/指令/反制卡定制工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { font-family: sans-serif; display: flex; gap: 30px; padding: 20px; background: #f0f0f0; }
  #controls { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  #controls label { font-weight: bold; margin-top: 10px; }
  #controls input, #controls select, #controls textarea { padding: 8px; }
  
  .btn { padding: 10px; background: #333; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 4px; }
  .btn:hover { background: #555; }
  
  #card-preview {
    width: 350px; height: 490px;
    border: 8px solid #333;
    background: #e8e0d0; 
    position: relative;
    display: flex; flex-direction: column;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    font-family: 'Arial Black', sans-serif;
  }

  #unit-topbar {
    display: none;
    width: 100%;
    height: 45px;
    background: #000; 
    position: relative;
    z-index: 10;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    padding: 0 10px 0 70px; 
    box-sizing: border-box;
  }

  #unit-card-name {
    flex-grow: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 10px;
  }

  #unit-nation {
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 35px;
  }
  #unit-nation .nation-svg { width: 35px; height: 35px; display: none; }
  #unit-nation .nation-svg.active { display: block; }

  .custom-icon-main { width: 45px; height: 45px; display: block; }
  .custom-icon-unit { width: 35px; height: 35px; display: block; }

  #card-img { 
    width: 100%; 
    height: 60%; 
    object-fit: cover; 
    border-bottom: 2px solid #333; 
    background: gray; 
    margin-bottom: -15px;
    position: relative;
    z-index: 1; 
  }
  
  .britain { background: #c41e3a; }
  .germany { background: #4a4a4a; }
  .usa { background: #3b5b92; }
  .ussr { background: #8b0000; }
  .japan { background: #dcdcdc; }
  .france { background: #0055a4; }
  .italy { background: #009246; }
  .poland { background: #dc143c; }
  .finland { background: #003580; }
  .australia { background: #00008b; }
  .neutral { background: #dcdcdc; }
  
  #cost-box { 
    position: absolute; top: 5px; left: 5px; 
    background: #111; color: white; 
    padding: 4px 6px 10px 6px; 
    z-index: 10; border: 1px solid #555; 
    display: flex; align-items: center;
  }
  #cost-display { font-size: 30px; font-weight: bold; line-height: 34px; }
  #cost-stack { display: flex; flex-direction: column; margin-left: 2px; }
  #cost-stack span.k { color: #d4af37; font-size: 14px; line-height: 12px; font-weight: bold; }
  #action-display { font-size: 12px; line-height: 12px; font-weight: bold; color: white; display: none; }
  
  #nation-icon { 
    position: absolute; top: 5px; right: 5px; 
    width: 45px; height: 45px; 
    background: transparent; 
    border: none; 
    border-radius: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    z-index: 10;
  }
  .nation-svg { width: 45px; height: 45px; display: none; }
  .nation-svg.active { display: block; }

  #text-area { 
    padding: 10px; 
    text-align: center; 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start; 
    margin-top: -15px;
    position: relative;
    z-index: 2;
    padding-top: 20px; 
  }
  
  #icon-area { 
    display: block; 
    width: 100%;
    margin: 0 auto; 
    min-height: 60px; 
    margin-top: -10px; 
    position: relative;
  }
  
  #icon-order, #icon-counter { 
    display: flex; 
    justify-content: center; 
    align-items: center;
    background: #111; color: white; font-size: 24px; font-weight: bold; 
    width: 30px; height: 30px; 
    margin: 0 auto; 
  }

  #unit-icon-area {
    display: none; 
    position: relative;
    width: 100%;
    height: 55px; 
  }

  #unit-icon-area .unit-stat {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    background: #111; color: white; font-weight: 900; 
    font-size: 24px;
    padding: 0;
    width: 44px; 
    height: 44px; 
    display: flex; justify-content: center; align-items: center;
    box-sizing: border-box;
  }

  #attack-icon { left: 25%; }
  #health-icon { left: 75%; }

  #unit-emoji {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 44px; 
    height: 44px;
    background-color: #3E403B; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    padding: 0; 
    overflow: hidden;
    box-sizing: border-box;
    margin: 0;
  }

  #unit-emoji img { 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    display: block;
    margin: 0;
  }

  #unit-emoji::after {
    content: '?';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 16px;
    font-weight: bold;
    display: none; 
  }
  
  #unit-emoji.error::after {
    display: block;
  }

  .half-up { border-radius: 50% 50% 0 0; }
  .half-down { border-radius: 0 0 50% 50%; }
  .round-up { border-radius: 50%; }

  #card-name { font-size: 24px; font-weight: 900; text-transform: uppercase; margin: 10px 0 5px; letter-spacing: 1px; }
  #card-tag { font-size: 14px; font-style: italic; color: #444; margin-bottom: 5px; white-space: pre-wrap; word-wrap: break-word; text-align: center; }
  #card-text { font-family: sans-serif; font-size: 16px; line-height: 1.3; text-align: center; margin-top: 10px; min-height: 50px; max-height: 90px; overflow: hidden; word-wrap: break-word; }

  #rarity-box { display: flex; justify-content: center; gap: 4px; padding: 10px; align-items: center; }
  .rarity-square { width: 12px; height: 12px; display: inline-block; }
  .rarity-star { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; line-height: 10px; display: inline-block; font-weight: bold; }
</style>
</head>
<body>
  
<div id="controls">
  <h2>卡牌定制器</h2>
  
  <label>卡牌类型 (Type)</label>
  <select id="card-type" onchange="updateCardType()">
    <option value="order">指令卡</option>
    <option value="unit">单位卡</option>
    <option value="counter">反制卡</option>
  </select>

  <label>阵营 (Faction)</label>
  <select id="nation" onchange="updateNation(); updateRarity(); updateUnitTopBarColor();">
    <option value="britain">英国 (Britain)</option>
    <option value="germany">德国 (Germany)</option>
    <option value="usa">美国 (USA)</option>
    <option value="ussr">苏联 (USSR)</option>
    <option value="japan">日本 (Japan)</option>
    <option value="france">法国 (France)</option>
    <option value="italy">意大利 (Italy)</option>
    <option value="poland">波兰 (Poland)</option>
    <option value="finland">芬兰 (Finland)</option>
    <option value="australia">澳大利亚 (Australia)</option>
    <option value="neutral">中立 (Neutral)</option>
  </select>

  <label>部署费用 (Cost)</label>
  <input type="number" id="cost" value="1" min="0" max="12" oninput="updateCard()">

  <label>卡名 (Name)</label>
  <input type="text" id="name" value="一杯茶" oninput="updateCard()">

  <div id="unit-controls" style="display: none;">
    <label>行动花费 (Action Cost)</label>
    <input type="number" id="action" value="0" min="0" max="3" oninput="updateCard()">

    <label>兵种 (Unit Type)</label>
    <select id="unit-type" onchange="updateUnitType()">
      <option value="infantry">步兵 (步兵.jpg)</option>
      <option value="tank">坦克 (坦克.jpg)</option>
      <option value="fighter">战斗机 (战斗机.jpg)</option>
      <option value="bomber">轰炸机 (轰炸机.jpg)</option>
      <option value="artillery">炮兵 (炮兵.jpg)</option>
    </select>

    <label>攻击力 (Attack)</label>
    <input type="number" id="attack" value="2" min="0" max="9" oninput="updateCard()">

    <label>生命值 (Health)</label>
    <input type="number" id="health" value="3" min="0" max="9" oninput="updateCard()">
  </div>

  <label>自定义框颜色 (RGB) <br><small>清空输入框则恢复阵营默认色</small></label>
  <div style="display: flex; gap: 5px;">
    <input type="number" id="r" min="0" max="255" placeholder="R" style="width: 60px;" oninput="updateUnitTopBarColor()">
    <input type="number" id="g" min="0" max="255" placeholder="G" style="width: 60px;" oninput="updateUnitTopBarColor()">
    <input type="number" id="b" min="0" max="255" placeholder="B" style="width: 60px;" oninput="updateUnitTopBarColor()">
  </div>

  <label>类型标签 (Tag - 如：闪击，可换行)</label>
  <textarea id="tag" rows="2" placeholder="可留空" oninput="updateCard()"></textarea>

  <label>效果描述 (Text) <br><small>提示：使用 <b>$b</b> 标记加粗，如：一二三$b四五$b六七</small></label>
  <textarea id="text" rows="8" oninput="updateCard()">部署：下个友方回合开始时，失去1个指挥点。</textarea>

  <label>卡面图片 URL (Image URL)</label>
  <input type="text" id="img" placeholder="https://..." oninput="updateCard()">
  
  <label>本地导入卡面</label>
  <input type="file" id="imgUpload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
  <button class="btn" onclick="document.getElementById('imgUpload').click()">选择本地图片</button>

  <label>自定义阵营图标</label>
  <input type="file" id="iconUpload" accept="image/*" style="display:none;" onchange="handleIconUpload(event)">
  <button class="btn" onclick="document.getElementById('iconUpload').click()">上传/替换图标</button>

  <label>自定义兵种图标</label>
  <input type="file" id="unitIconUpload" accept="image/*" style="display:none;" onchange="handleUnitIconUpload(event)">
  <button class="btn" onclick="document.getElementById('unitIconUpload').click()">上传/替换当前兵种</button>

  <label>稀有度 (Rarity)</label>
  <select id="rarity" onchange="updateRarity()">
    <option value="iron">铁</option>
    <option value="copper">铜</option>
    <option value="silver">银</option>
    <option value="gold">金</option>
  </select>

  <button class="btn" onclick="exportCard()">导出高清卡图 (PNG)</button>
</div>

<div id="card-preview" class="britain">
  
  <div id="unit-topbar">
    <div id="unit-card-name">一杯茶</div>
    <div id="unit-nation">
      <svg id="svg-britain-unit" class="nation-svg active" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><circle cx="50" cy="50" r="30" fill="#FFFFFF" /><circle cx="50" cy="50" r="16" fill="#CC0000" /></svg>
      <svg id="svg-germany-unit" class="nation-svg" viewBox="0 0 100 100"><g transform="rotate(45 50 50)"><polygon points="20,20 40,20 50,30 60,20 80,20 80,40 70,50 80,60 80,80 60,80 50,70 40,80 20,80 20,60 30,50 20,40" fill="#000000" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" /></g></svg>
      <svg id="svg-usa-unit" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><polygon points="50,15 58,38 82,38 63,52 69,75 50,60 31,75 37,52 18,38 42,38" fill="#FFFFFF" /></svg>
      <svg id="svg-ussr-unit" class="nation-svg" viewBox="0 0 100 100"><polygon points="50,15 58,38 82,38 63,52 69,75 50,60 31,75 37,52 18,38 42,38" fill="#cc0000" stroke="#d4af37" stroke-width="4" /></svg>
      <svg id="svg-japan-unit" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFFFFF" /><circle cx="50" cy="50" r="30" fill="#cc0000" /></svg>
      
      <svg id="svg-france-unit" class="nation-svg" viewBox="0 0 100 100"><rect width="33" height="100" fill="#0055A4"/><rect x="33" width="34" height="100" fill="#FFFFFF"/><rect x="67" width="33" height="100" fill="#EF4135"/></svg>
      <svg id="svg-italy-unit" class="nation-svg" viewBox="0 0 100 100"><rect width="33" height="100" fill="#009246"/><rect x="33" width="34" height="100" fill="#FFFFFF"/><rect x="67" width="33" height="100" fill="#CE2B37"/></svg>
      <svg id="svg-poland-unit" class="nation-svg" viewBox="0 0 100 100"><rect width="50" height="50" fill="#DC143C"/><rect x="50" width="50" height="50" fill="#FFFFFF"/><rect y="50" width="50" height="50" fill="#FFFFFF"/><rect x="50" y="50" width="50" height="50" fill="#DC143C"/></svg>
      <svg id="svg-finland-unit" class="nation-svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FFFFFF"/><rect x="30" width="20" height="100" fill="#003580"/><rect y="30" width="100" height="20" fill="#003580"/></svg>
      <svg id="svg-australia-unit" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><circle cx="50" cy="50" r="34" fill="#FFFFFF" /></svg>
      <svg id="svg-neutral-unit" class="nation-svg" viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" fill="#FFFFFF" stroke="#333" stroke-width="2" transform="rotate(45 50 50)"/><rect x="25" y="25" width="50" height="50" fill="#000" transform="rotate(45 50 50)"/></svg>
    </div>
  </div>

  <div id="cost-box">
    <span id="cost-display">1</span>
    <div id="cost-stack">
      <span class="k">K</span>
      <span id="action-display">0</span>
    </div>
  </div>
  
  <div id="nation-icon">
    <svg id="svg-britain" class="nation-svg active" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><circle cx="50" cy="50" r="30" fill="#FFFFFF" /><circle cx="50" cy="50" r="16" fill="#CC0000" /></svg>
    <svg id="svg-germany" class="nation-svg" viewBox="0 0 100 100"><g transform="rotate(45 50 50)"><polygon points="20,20 40,20 50,30 60,20 80,20 80,40 70,50 80,60 80,80 60,80 50,70 40,80 20,80 20,60 30,50 20,40" fill="#000000" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" /></g></svg>
    <svg id="svg-usa" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><polygon points="50,15 58,38 82,38 63,52 69,75 50,60 31,75 37,52 18,38 42,38" fill="#FFFFFF" /></svg>
    <svg id="svg-ussr" class="nation-svg" viewBox="0 0 100 100"><polygon points="50,15 58,38 82,38 63,52 69,75 50,60 31,75 37,52 18,38 42,38" fill="#cc0000" stroke="#d4af37" stroke-width="4" /></svg>
    <svg id="svg-japan" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFFFFF" /><circle cx="50" cy="50" r="30" fill="#cc0000" /></svg>

    <svg id="svg-france" class="nation-svg" viewBox="0 0 100 100"><rect width="33" height="100" fill="#0055A4"/><rect x="33" width="34" height="100" fill="#FFFFFF"/><rect x="67" width="33" height="100" fill="#EF4135"/></svg>
    <svg id="svg-italy" class="nation-svg" viewBox="0 0 100 100"><rect width="33" height="100" fill="#009246"/><rect x="33" width="34" height="100" fill="#FFFFFF"/><rect x="67" width="33" height="100" fill="#CE2B37"/></svg>
    <svg id="svg-poland" class="nation-svg" viewBox="0 0 100 100"><rect width="50" height="50" fill="#DC143C"/><rect x="50" width="50" height="50" fill="#FFFFFF"/><rect y="50" width="50" height="50" fill="#FFFFFF"/><rect x="50" y="50" width="50" height="50" fill="#DC143C"/></svg>
    <svg id="svg-finland" class="nation-svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FFFFFF"/><rect x="30" width="20" height="100" fill="#003580"/><rect y="30" width="100" height="20" fill="#003580"/></svg>
    <svg id="svg-australia" class="nation-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#003399" /><circle cx="50" cy="50" r="34" fill="#FFFFFF" /></svg>
    <svg id="svg-neutral" class="nation-svg" viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" fill="#FFFFFF" stroke="#333" stroke-width="2" transform="rotate(45 50 50)"/><rect x="25" y="25" width="50" height="50" fill="#000" transform="rotate(45 50 50)"/></svg>
  </div>

  <img id="card-img" src="" alt="卡面">
  <div id="text-area">
    <div id="icon-area">
      <div id="icon-order" style="display:flex;">!</div>
      <div id="icon-counter" style="display:none;">?</div>
      
      <div id="unit-icon-area" style="display:none;">
        <div id="attack-icon" class="unit-stat half-up">2</div>
        <div id="unit-emoji"></div>
        <div id="health-icon" class="unit-stat half-down">2</div>
      </div>
    </div>
    
    <div id="card-name">一杯茶</div>
    <div id="card-tag"></div>
    <div id="card-text">部署：下个友方回合开始时，失去1个指挥点。</div>
  </div>

  <div id="rarity-box"></div>
</div>

<script>
  const inputEls = {
    type: document.getElementById('card-type'),
    nation: document.getElementById('nation'),
    cost: document.getElementById('cost'),
    action: document.getElementById('action'),
    name: document.getElementById('name'),
    unitType: document.getElementById('unit-type'),
    attack: document.getElementById('attack'),
    health: document.getElementById('health'),
    tag: document.getElementById('tag'),
    text: document.getElementById('text'),
    img: document.getElementById('img'),
    rarity: document.getElementById('rarity'),
    r: document.getElementById('r'),
    g: document.getElementById('g'),
    b: document.getElementById('b')
  };

  const displayEls = {
    cardPreview: document.getElementById('card-preview'),
    costDisplay: document.getElementById('cost-display'),
    actionDisplay: document.getElementById('action-display'),
    costBox: document.getElementById('cost-box'),
    nationIcon: document.getElementById('nation-icon'),
    unitTopbar: document.getElementById('unit-topbar'),
    unitCardName: document.getElementById('unit-card-name'),
    unitNation: document.getElementById('unit-nation'),
    cardImg: document.getElementById('card-img'),
    cardName: document.getElementById('card-name'),
    cardTag: document.getElementById('card-tag'),
    cardText: document.getElementById('card-text'),
    rarityBox: document.getElementById('rarity-box'),
    iconOrder: document.getElementById('icon-order'),
    iconCounter: document.getElementById('icon-counter'),
    unitIconArea: document.getElementById('unit-icon-area'),
    unitEmoji: document.getElementById('unit-emoji'),
    attackIcon: document.getElementById('attack-icon'),
    healthIcon: document.getElementById('health-icon'),
    unitControls: document.getElementById('unit-controls')
  };

  let customIconData = null;
  let customUnitIcons = {};
  let currentCardImg = ''; 

  const factionColors = {
    britain: '#c41e3a', germany: '#4a4a4a', usa: '#3b5b92', ussr: '#8b0000', japan: '#dcdcdc',
    france: '#0055a4', italy: '#009246', poland: '#dc143c', finland: '#003580', australia: '#00008b', neutral: '#dcdcdc'
  };

  const factionTopBarColors = {
    ussr: '#584631', japan: '#967233', britain: '#93825C', usa: '#5A5D3A',
    germany: '#5B6358', france: '#444B62', italy: '#605C52', finland: '#B3AD95',
    australia: '#744C21', poland: '#5F5640', neutral: '#404040'
  };

  const rarityColors = {
    iron: '#808080', copper: '#b87333', silver: '#c0c0c0', gold: '#d4af37'
  };

  const unitTypeMap = {
    infantry: { img: '步兵.jpg', shapeClass: 'half-up' },
    tank: { img: '坦克.jpg', shapeClass: 'half-up' },
    fighter: { img: '战斗机.jpg', shapeClass: 'round-up' },
    bomber: { img: '轰炸机.jpg', shapeClass: 'round-up' },
    artillery: { img: '炮兵.jpg', shapeClass: 'round-up' }
  };

  function updateCardType() {
    const type = inputEls.type.value;
    const isUnit = type === 'unit';
    const isCounter = type === 'counter';
    
    displayEls.unitControls.style.display = isUnit ? 'block' : 'none';
    displayEls.unitTopbar.style.display = isUnit ? 'flex' : 'none';
    displayEls.nationIcon.style.display = isUnit ? 'none' : 'flex';

    displayEls.costBox.style.display = 'flex';
    displayEls.costBox.style.top = isUnit ? '0px' : '5px';
    displayEls.costBox.style.left = isUnit ? '0px' : '5px';
    displayEls.costBox.style.zIndex = isUnit ? '20' : '10';

    displayEls.unitCardName.style.display = isUnit ? 'block' : 'none';
    displayEls.cardName.style.display = isUnit ? 'none' : 'block';

    displayEls.iconOrder.style.display = (type === 'order') ? 'flex' : 'none';
    displayEls.iconCounter.style.display = isCounter ? 'flex' : 'none';
    displayEls.unitIconArea.style.display = isUnit ? 'block' : 'none';
    
    displayEls.cardImg.style.height = isUnit ? '55%' : '60%';
    displayEls.actionDisplay.style.display = isUnit ? 'block' : 'none';

    if (isUnit) {
      updateUnitType();
      updateUnitTopBarColor(); 
    }
    updateCard();
  }

  function updateUnitType() {
    const unitType = inputEls.unitType.value;
    const config = unitTypeMap[unitType];
    const customImg = customUnitIcons[unitType];
    const src = customImg || config.img;
    
    displayEls.unitEmoji.innerHTML = `<img src="${src}" alt="${src}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
    
    const img = displayEls.unitEmoji.querySelector('img');
    if (img) {
        img.onload = () => {
            displayEls.unitEmoji.classList.remove('error');
        };
        img.onerror = () => {
            displayEls.unitEmoji.classList.add('error');
            img.style.display = 'none';
        };
    }
    
    displayEls.attackIcon.className = 'unit-stat ' + config.shapeClass;
    displayEls.healthIcon.className = 'unit-stat half-down';
  }

  function handleIconUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            customIconData = e.target.result;
            updateNation();
        };
        reader.readAsDataURL(file);
    }
  }

  function handleUnitIconUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            customUnitIcons[inputEls.unitType.value] = e.target.result;
            updateUnitType();
        };
        reader.readAsDataURL(file);
    }
  }

  function updateUnitTopBarColor() {
    const r = inputEls.r.value;
    const g = inputEls.g.value;
    const b = inputEls.b.value;

    let color = '#000'; 

    if (r !== '' && g !== '' && b !== '') {
        color = `rgb(${r}, ${g}, ${b})`;
    } else {
        color = factionTopBarColors[inputEls.nation.value] || '#000';
    }
    
    displayEls.unitTopbar.style.backgroundColor = color;
  }

  function updateNation() {
    displayEls.cardPreview.classList.remove('britain', 'germany', 'usa', 'ussr', 'japan', 'france', 'italy', 'poland', 'finland', 'australia', 'neutral');
    displayEls.cardPreview.classList.add(inputEls.nation.value);

    const iconArea = document.getElementById('nation-icon');
    const unitIconArea = document.getElementById('unit-nation');

    if (customIconData) {
        iconArea.querySelectorAll('.nation-svg').forEach(svg => svg.style.display = 'none');
        unitIconArea.querySelectorAll('.nation-svg').forEach(svg => svg.style.display = 'none');

        let customMain = document.getElementById('custom-icon-main');
        if (!customMain) {
            customMain = document.createElement('img');
            customMain.id = 'custom-icon-main';
            customMain.className = 'custom-icon-main';
            iconArea.appendChild(customMain);
        }
        customMain.src = customIconData;
        customMain.style.display = 'block';

        let customUnit = document.getElementById('custom-icon-unit');
        if (!customUnit) {
            customUnit = document.createElement('img');
            customUnit.id = 'custom-icon-unit';
            customUnit.className = 'custom-icon-unit';
            unitIconArea.appendChild(customUnit);
        }
        customUnit.src = customIconData;
        customUnit.style.display = 'block';

    } else {
        const customMain = document.getElementById('custom-icon-main');
        const customUnit = document.getElementById('custom-icon-unit');
        if (customMain) customMain.style.display = 'none';
        if (customUnit) customUnit.style.display = 'none';

        iconArea.querySelectorAll('.nation-svg').forEach(svg => svg.style.display = '');
        unitIconArea.querySelectorAll('.nation-svg').forEach(svg => svg.style.display = '');

        iconArea.querySelectorAll('.nation-svg').forEach(svg => svg.classList.remove('active'));
        const targetSvg = document.getElementById('svg-' + inputEls.nation.value);
        if (targetSvg) targetSvg.classList.add('active');

        unitIconArea.querySelectorAll('.nation-svg').forEach(svg => svg.classList.remove('active'));
        const targetUnitSvg = document.getElementById('svg-' + inputEls.nation.value + '-unit');
        if (targetUnitSvg) targetUnitSvg.classList.add('active');
    }

    updateUnitTopBarColor();
  }

  function updateCard() {
    displayEls.costDisplay.innerText = inputEls.cost.value;
    displayEls.actionDisplay.innerText = inputEls.action.value;
    
    if (inputEls.img.value) {
        displayEls.cardImg.src = inputEls.img.value;
    } else if (currentCardImg) {
        displayEls.cardImg.src = currentCardImg;
    } else {
        displayEls.cardImg.removeAttribute('src');
    }
    
    displayEls.cardName.innerText = inputEls.name.value ? inputEls.name.value.toUpperCase() : "卡名";
    displayEls.unitCardName.innerText = inputEls.name.value ? inputEls.name.value.toUpperCase() : "卡名";
    
    displayEls.attackIcon.innerText = inputEls.attack.value;
    displayEls.healthIcon.innerText = inputEls.health.value;
    
    const tagValue = inputEls.tag.value;
    if (tagValue.trim() === '') {
        displayEls.cardTag.style.display = 'none';
    } else {
        displayEls.cardTag.style.display = 'block';
        displayEls.cardTag.innerText = tagValue;
    }
    
    let textValue = inputEls.text.value;
    if (!textValue) textValue = "请输入效果描述...";

    let escapedText = textValue.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const parts = escapedText.split('$b');
    let formattedText = '';
    
    for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) formattedText += '<b>' + parts[i] + '</b>';
        else formattedText += parts[i];
    }

    displayEls.cardText.innerHTML = formattedText;

    let fontSize = 16;
    const len = textValue.length; 
    
    if (len > 120) fontSize = 8;
    else if (len > 80) fontSize = 10;
    else if (len > 50) fontSize = 12;
    else if (len > 25) fontSize = 14;
    else fontSize = 16;
    
    displayEls.cardText.style.fontSize = fontSize + 'px';
    displayEls.cardText.style.lineHeight = (fontSize * 1.3) + 'px';
  }

  function updateRarity() {
    const rarity = inputEls.rarity.value;
    const box = displayEls.rarityBox;
    
    const starColor = factionColors[inputEls.nation.value];
    const squareColor = rarityColors[rarity];

    box.innerHTML = '';
    box.className = 'rarity-box';

    const createSq = (hasStar) => {
        const sq = document.createElement('div');
        sq.className = 'rarity-square';
        sq.style.backgroundColor = squareColor;
        sq.style.position = 'relative';
        
        if (hasStar) {
            const star = document.createElement('span');
            star.className = 'rarity-star';
            star.innerText = '★';
            star.style.color = starColor;
            sq.appendChild(star);
        }
        return sq;
    };

    if (rarity === 'iron') {
        for (let i = 0; i < 4; i++) box.appendChild(createSq(false));
    } else if (rarity === 'copper') {
        for (let i = 0; i < 3; i++) box.appendChild(createSq(false));
    } else if (rarity === 'silver') {
        box.appendChild(createSq(true));
        box.appendChild(createSq(true));
    } else if (rarity === 'gold') {
        box.appendChild(createSq(true));
    }
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentCardImg = e.target.result;
            displayEls.cardImg.src = currentCardImg;
            inputEls.img.value = '';
        };
        reader.readAsDataURL(file);
    }
  }

  async function exportCard() {
    const node = displayEls.cardPreview;
    const allImages = node.querySelectorAll('img');
    
    // 收集需要处理的非Base64图片
    let failedImages = [];
    
    for (let img of allImages) {
        // 已经是 Base64 的图片完美支持，跳过
        if (img.src && img.src.startsWith('data:image/')) continue;
        
        // 尝试通过 fetch 获取图片并转成 Base64，解决跨域污染
        try {
            const response = await fetch(img.src);
            const blob = await response.blob();
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
            img.src = base64;
        } catch (e) {
            // 记录失败图片，不替换透明，避免破坏卡面
            failedImages.push(img.src);
            console.warn("图片无法转换为Base64：", img.src);
        }
    }
    
    // 如果有图片抓取失败，尝试导出并针对可能报错的情况给出明确提示
    if (failedImages.length > 0) {
        alert("注意：检测到本地图片（如默认兵种图标）无法直接导出。\n\n解决方法：\n1. 请务必点击“自定义兵种图标”上传该图片（推荐，完美无损）；\n2. 或将本文件放入本地服务器（如VS Code的Live Server）中运行。\n\n现在尝试导出（但可能失败）...");
    }
    
    // 尝试导出
    html2canvas(node, {
        scale: 3,
        backgroundColor: null,
        useCORS: true,
        logging: false
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'kards_card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // 如果修复了图片，后续点导出就会正常。
    }).catch(err => {
        alert("导出失败：" + err.message + "\n\n请务必点击【自定义兵种图标】上传当前所有兵种图片（上传即变完美），或者使用本地服务器打开页面。");
    });
  }

  updateNation();
  updateRarity();
  updateCardType();
  updateCard();
</script>
